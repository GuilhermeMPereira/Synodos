# Identidade visual do Synodos: preto e ambar sobre fundo branco.
# As cores exatas vieram do prototipo da Sprint 1.
[theme]
base = "light"
primaryColor = "#e7c12e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f6"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false
